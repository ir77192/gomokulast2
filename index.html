<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목 AI</title>

<style>
body{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    background:#f2d28b;
    font-family:sans-serif;
}
h1{margin:5px;}

#controls{
    margin-bottom:10px;
}

#board{
    display:grid;
    grid-template-columns:repeat(15, 6vw);
    grid-template-rows:repeat(15, 6vw);
    max-width:95vw;
    max-height:95vw;
    background:#deb887;
}

.cell{
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.black{
    width:80%;
    height:80%;
    background:black;
    border-radius:50%;
}

.white{
    width:80%;
    height:80%;
    background:white;
    border-radius:50%;
}
</style>
</head>
<body>

<h1>오목 AI</h1>

<div id="controls">
난이도:
<select id="difficulty">
<option value="easy">쉬움</option>
<option value="normal" selected>보통</option>
<option value="hard">어려움</option>
</select>
<button onclick="resetGame()">리셋</button>
</div>

<div id="board"></div>

<script>
const SIZE=15;
let board=[];
let current="black";
let gameOver=false;
let difficulty="normal";

const boardDiv=document.getElementById("board");
const diffSelect=document.getElementById("difficulty");

diffSelect.addEventListener("change",()=>{
    difficulty=diffSelect.value;
});

function init(){
    board=[];
    boardDiv.innerHTML="";
    gameOver=false;
    current="black";

    for(let r=0;r<SIZE;r++){
        board[r]=[];
        for(let c=0;c<SIZE;c++){
            board[r][c]=null;
            const cell=document.createElement("div");
            cell.className="cell";
            cell.dataset.r=r;
            cell.dataset.c=c;
            cell.addEventListener("click",handleClick);
            boardDiv.appendChild(cell);
        }
    }
}

function handleClick(e){
    if(gameOver) return;
    if(current!=="black") return;

    const r=parseInt(e.target.dataset.r);
    const c=parseInt(e.target.dataset.c);

    if(board[r][c]) return;

    place(r,c,"black");

    if(checkWin(r,c,"black")){
        alert("플레이어 승리!");
        gameOver=true;
        return;
    }

    current="white";
    setTimeout(aiMove,200);
}

function place(r,c,color){
    board[r][c]=color;
    const index=r*SIZE+c;
    const cell=boardDiv.children[index];
    const stone=document.createElement("div");
    stone.className=color;
    cell.appendChild(stone);
    playSound();
}

function aiMove(){
    if(gameOver) return;

    let best=null;
    let bestScore=-Infinity;

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(board[r][c]) continue;

            let score=0;

            if(difficulty==="easy"){
                score=Math.random()*100;
            }
            else{
                score+=countScore(r,c,"white")*3;
                score+=countScore(r,c,"black")*2;
                if(difficulty==="hard") score+=Math.random()*5;
                else score+=Math.random()*50;
            }

            if(score>bestScore){
                bestScore=score;
                best=[r,c];
            }
        }
    }

    if(best){
        place(best[0],best[1],"white");

        if(checkWin(best[0],best[1],"white")){
            alert("AI 승리!");
            gameOver=true;
            return;
        }
    }

    current="black";
}

function countScore(r,c,color){
    let total=0;
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(let [dr,dc] of dirs){
        let count=0;
        for(let i=1;i<5;i++){
            let nr=r+dr*i;
            let nc=c+dc*i;
            if(nr<0||nc<0||nr>=SIZE||nc>=SIZE) break;
            if(board[nr][nc]===color) count++;
            else break;
        }
        total+=count;
    }
    return total;
}

function checkWin(r,c,color){
    const dirs=[[1,0],[0,1],[1,1],[1,-1]];

    for(let [dr,dc] of dirs){
        let count=1;

        for(let i=1;i<5;i++){
            let nr=r+dr*i;
            let nc=c+dc*i;
            if(nr<0||nc<0||nr>=SIZE||nc>=SIZE) break;
            if(board[nr][nc]===color) count++;
            else break;
        }

        for(let i=1;i<5;i++){
            let nr=r-dr*i;
            let nc=c-dc*i;
            if(nr<0||nc<0||nr>=SIZE||nc>=SIZE) break;
            if(board[nr][nc]===color) count++;
            else break;
        }

        if(count>=5) return true;
    }
    return false;
}

function playSound(){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine";
    osc.frequency.value=500;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.1);
    osc.stop(ctx.currentTime+0.1);
}

function resetGame(){
    init();
}

init();
</script>

</body>
</html>
